services:
  - type: web
    name: legallens-ai-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false  # set this in the Render dashboard, don't commit it
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: VECTOR_STORE_PATH
        value: /app/vector_store
      - key: FRONTEND_URL
        value: "*"  # tighten this to your actual frontend URL once deployed
    # NOTE: no persistent disk here on purpose — Render's free tier doesn't
    # support them (only paid instance types do). This means the vector
    # store resets whenever the service restarts/redeploys/spins down from
    # inactivity, so uploaded documents won't survive across sessions.
    # That's fine for demoing the app; if you need documents to persist,
    # upgrade to a paid Render plan and add a `disk:` block back, or swap
    # in a hosted vector DB (e.g. a free-tier Pinecone/Qdrant Cloud index).

  - type: web
    name: legallens-ai-frontend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.frontend
    dockerContext: .
    plan: free
